name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET build, unit, integration, architecture tests)
    runs-on: ubuntu-latest
    env:
      # Throwaway password for the CI-only SQL Server container; not a secret, regenerated per run.
      SA_PASSWORD: Ci-${{ github.run_id }}-Aa1!
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci-${{ github.run_id }}-Aa1!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore (NuGet audit fails the build on vulnerable packages)
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        env:
          MARKETPULSE_TEST_SQL: Server=localhost,1433;User Id=sa;Password=${{ env.SA_PASSWORD }};TrustServerCertificate=True;Encrypt=True
        run: dotnet test --no-build -c Release --logger "trx" --results-directory TestResults

      - name: Check committed SQL migration scripts are up to date
        run: |
          dotnet tool restore
          for pair in \
            "src/Modules/Identity/MarketPulse.Modules.Identity:IdentityModuleDbContext:01-auth" \
            "src/Modules/Instruments/MarketPulse.Modules.Instruments:InstrumentsDbContext:02-master" \
            "src/Modules/Workspace/MarketPulse.Modules.Workspace:WorkspaceDbContext:03-workspace" \
            "src/Modules/Administration/MarketPulse.Modules.Administration:AdministrationDbContext:04-ops"; do
            IFS=: read -r project context file <<< "$pair"
            dotnet ef migrations script --idempotent --no-build --configuration Release \
              --project "$project" --startup-project src/Hosts/MarketPulse.Api --context "$context" \
              --output "/tmp/$file.sql"
            diff <(tr -d '\r' < "deployment/sql/$file.sql") <(tr -d '\r' < "/tmp/$file.sql") \
              || { echo "deployment/sql/$file.sql is stale. Regenerate it."; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

  frontend:
    name: Frontend (type-check, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Web/marketpulse-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Web/marketpulse-web/package-lock.json

      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev

      - name: Generated API types match the committed OpenAPI contract
        run: |
          npm run generate:api
          git diff --exit-code -- src/shared/api/schema.d.ts

      - run: npm run typecheck
      - run: npm test
      - run: npm run build
